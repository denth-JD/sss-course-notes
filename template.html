<title>SSS Study Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header with note tabs; on wide screens a section index rail beside a reading column; on phones the index becomes a jump menu and wide HIRARC tables become cards. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1b2530; --muted:#5b6774; --line:#d9dedf;
  --accent:#1f5f8b; --accent-ink:#ffffff; --hi:#e2a400; --head:#1d2b3a; --head-fg:#f1f4f6;
  --hRisk:#c0392b; --mRisk:#b7791f; --lRisk:#2f855a; --chip-bg:rgba(0,0,0,.05);
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d; --surface:#18212a; --fg:#e4e9ee; --muted:#9aa7b4; --line:#2c3844;
  --accent:#6fb0dd; --accent-ink:#0d1620; --hi:#f0b429; --head:#0b1117; --head-fg:#e4e9ee;
  --hRisk:#f07167; --mRisk:#e9b44c; --lRisk:#5fbf8a; --chip-bg:rgba(255,255,255,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#18212a; --fg:#e4e9ee; --muted:#9aa7b4; --line:#2c3844;
  --accent:#6fb0dd; --accent-ink:#0d1620; --hi:#f0b429; --head:#0b1117; --head-fg:#e4e9ee;
  --hRisk:#f07167; --mRisk:#e9b44c; --lRisk:#5fbf8a; --chip-bg:rgba(255,255,255,.07); color-scheme:dark}

html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.6}
*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--head);color:var(--head-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;
  border-bottom:4px solid var(--hi)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 0}
.brand b{font-family:var(--display);font-size:1.45rem;letter-spacing:.02em;line-height:1.1}
.brand span{font-size:.78rem;color:var(--head-fg);opacity:.75;letter-spacing:.04em;text-transform:uppercase}
.tools{display:flex;gap:6px;align-items:center}
.tbtn{font:600 .85rem var(--body);background:transparent;color:var(--head-fg);border:1px solid rgba(255,255,255,.35);
  border-radius:6px;padding:7px 10px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--hi)}
.tbtn svg{width:16px;height:16px}
.tabs{display:flex;gap:2px;max-width:1320px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:700 1.02rem var(--display);letter-spacing:.03em;text-transform:uppercase;background:transparent;color:var(--head-fg);
  opacity:.7;border:0;border-radius:6px 6px 0 0;padding:9px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;background:var(--hi);color:#1b1b1b}

/* Body layout */
.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);align-self:start;max-height:calc(100vh - 140px);overflow:auto}
.rail h4{font:700 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.rail a{display:block;color:var(--fg);text-decoration:none;font-size:.9rem;padding:6px 10px;border-left:3px solid var(--line);line-height:1.35}
.rail a:hover{border-left-color:var(--accent);color:var(--accent)}
.jump{display:none;margin-bottom:16px}
.jump label{font:700 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.jump select{width:100%;font:1rem var(--body);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}

article{min-width:0}
article h1{font:700 2.2rem/1.1 var(--display);letter-spacing:.01em;margin:0 0 6px;text-wrap:balance}
article h1 + p{color:var(--muted);margin-top:0}
article h2{font:700 1.55rem/1.2 var(--display);letter-spacing:.01em;margin:2.2em 0 .5em;padding-top:.6em;border-top:1px solid var(--line);
  text-wrap:balance;scroll-margin-top:140px}
article h3{font:700 1.2rem var(--display);margin:1.6em 0 .4em;scroll-margin-top:140px}
article p,article li{max-width:72ch}
article a{color:var(--accent)}
article strong{font-weight:600}
article ul,article ol{padding-left:1.4em}
article li{margin:.2em 0}
article ol > li > ul{list-style:none;padding-left:0;margin:.3em 0 .6em}
article ol > li > ul > li{background:var(--chip-bg);border-radius:6px;padding:6px 10px;font-size:.95rem}
code{font-family:var(--mono)}

/* Tables */
.tbl{overflow-x:auto;margin:1em 0 1.4em;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:700 .8rem var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--chip-bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.wide table{min-width:1100px}
.chip{display:inline-block;font:500 .82rem var(--mono);padding:2px 8px;border-radius:999px;white-space:nowrap;border:1.5px solid currentColor}
.r-H{color:var(--hRisk)} .r-M{color:var(--mRisk)} .r-L{color:var(--lRisk)}

/* Checklists */
.task-list-item,li:has(> input[type=checkbox]){list-style:none;margin-left:-1.4em}
input[type=checkbox]{width:20px;height:20px;vertical-align:-4px;margin-right:8px;accent-color:var(--accent)}

/* Answer reveal */
details.ans{margin:2.2em 0 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.ans > summary{cursor:pointer;list-style:none;padding:14px 16px;font:700 1.3rem var(--display);display:flex;justify-content:space-between;gap:12px;align-items:center}
details.ans > summary::-webkit-details-marker{display:none}
details.ans > summary::after{content:"Show";font:600 .8rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);padding:4px 10px;border-radius:999px}
details.ans[open] > summary::after{content:"Hide"}
details.ans > .ans-body{padding:0 16px 12px}
details.ans h2{display:none}

/* Focus mode (fallback when the browser blocks real full screen, e.g. iPhone) */
.exitfocus{display:none;position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--head);color:var(--head-fg);border:2px solid var(--hi);border-radius:999px;padding:10px 16px;font:600 .9rem var(--body);cursor:pointer}
body.focus .top{display:none}
body.focus .rail{display:none}
body.focus .wrap{grid-template-columns:minmax(0,1fr)}
body.focus .exitfocus{display:block}

@media (max-width:1000px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .jump{display:block}
}
/* Phone: wide tables become one card per row */
@media (max-width:760px){
  .brand span{display:none}
  .tbtn .lbl{display:none}
  article h1{font-size:1.8rem}
  .wide{border:0;background:transparent;overflow:visible}
  .wide table{min-width:0}
  .wide thead{display:none}
  .wide table,.wide tbody,.wide tr,.wide td{display:block;width:100%}
  .wide tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:6px 0}
  .wide td{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px;border:0;padding:5px 12px}
  .wide td::before{content:attr(data-label);font:700 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:.2em}
  .wide td > .chip{justify-self:start}
  .wide td:first-child{font:700 1.05rem var(--display);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<header class="top">
  <div class="bar">
    <div class="brand"><b>SSS Study Notes</b><span>NIOSH Kuching · 23 Nov – 4 Dec 2026</span></div>
    <div class="tools">
      <button class="tbtn" id="smaller" type="button" aria-label="Smaller text">A−</button>
      <button class="tbtn" id="bigger" type="button" aria-label="Larger text">A+</button>
      <button class="tbtn" id="fs" type="button" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="lbl" id="fslbl">Full screen</span>
      </button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Notes">
    <button class="tab" role="tab" id="tab-law" data-note="law" type="button">Law</button>
    <button class="tab" role="tab" id="tab-hirarc" data-note="hirarc" type="button">HIRARC</button>
    <button class="tab" role="tab" id="tab-practice" data-note="practice" type="button">Practice</button>
  </nav>
</header>

<div class="wrap">
  <aside class="rail" aria-label="Sections"><h4>Sections</h4><nav id="rail"></nav></aside>
  <main>
    <div class="jump"><label for="jumpsel">Jump to section</label><select id="jumpsel"></select></div>
    <article id="doc"><p>Loading notes…</p></article>
  </main>
</div>
<button class="exitfocus" id="exitfocus" type="button">Exit full screen</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script id="notes-data" type="application/json">/*__NOTES__*/</script>
<script>
(function(){
  var NOTES = JSON.parse(document.getElementById('notes-data').textContent);
  var store = {
    get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  var doc = document.getElementById('doc'), rail = document.getElementById('rail'), jump = document.getElementById('jumpsel');

  function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)}

  function enhanceTables(){
    doc.querySelectorAll('table').forEach(function(t){
      var box = document.createElement('div'); box.className = 'tbl';
      var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function(th){return th.textContent.trim()});
      if (heads.length >= 6) box.className += ' wide';
      t.parentNode.insertBefore(box, t); box.appendChild(t);
      t.querySelectorAll('tbody tr').forEach(function(tr){
        Array.prototype.forEach.call(tr.children, function(td, i){
          td.setAttribute('data-label', heads[i] || '');
          var txt = td.textContent.trim();
          var m = txt.match(/^(?:\d\s*[×x]\s*\d\s*=\s*)?\d{1,2}\s*([HML])$/);
          if (m && txt.length <= 14) td.innerHTML = '<span class="chip r-' + m[1] + '">' + txt + '</span>';
        });
      });
    });
  }

  function wrapAnswers(){
    var hs = Array.prototype.slice.call(doc.querySelectorAll('h2'));
    hs.forEach(function(h){
      if (!/^(Answer key|Model answers)/i.test(h.textContent)) return;
      var d = document.createElement('details'); d.className = 'ans'; d.id = h.id;
      var s = document.createElement('summary'); s.textContent = h.textContent; d.appendChild(s);
      var body = document.createElement('div'); body.className = 'ans-body'; d.appendChild(body);
      h.removeAttribute('id');
      h.parentNode.insertBefore(d, h);
      var n = h.nextSibling;
      body.appendChild(h);
      while (n && !(n.nodeType === 1 && n.tagName === 'H2')) { var next = n.nextSibling; body.appendChild(n); n = next; }
    });
  }

  function enableChecklists(key){
    doc.querySelectorAll('input[type=checkbox]').forEach(function(cb, i){
      cb.disabled = false; cb.id = 'chk-' + key + '-' + i;
      cb.checked = store.get(cb.id) === '1';
      cb.addEventListener('change', function(){store.set(cb.id, cb.checked ? '1' : '0')});
    });
  }

  function buildIndex(){
    rail.innerHTML = ''; jump.innerHTML = '<option value="">Choose a section…</option>';
    doc.querySelectorAll('h2, details.ans').forEach(function(h){
      var text = h.tagName === 'DETAILS' ? h.querySelector('summary').textContent : h.textContent;
      if (!h.id) h.id = slug(text);
      var a = document.createElement('a'); a.href = '#' + h.id; a.textContent = text;
      a.addEventListener('click', function(e){e.preventDefault(); go(h)});
      rail.appendChild(a);
      var o = document.createElement('option'); o.value = h.id; o.textContent = text; jump.appendChild(o);
    });
  }
  function go(el){
    if (el.tagName === 'DETAILS') el.open = true;
    el.scrollIntoView({block:'start'});
  }
  jump.addEventListener('change', function(){
    var el = document.getElementById(jump.value); if (el) go(el); jump.value = '';
  });

  function show(key){
    if (!NOTES[key]) key = 'law';
    document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected', t.dataset.note === key ? 'true' : 'false')});
    if (window.marked) {
      doc.innerHTML = marked.parse(NOTES[key], {gfm:true});
    } else {
      doc.innerHTML = '<pre style="white-space:pre-wrap">' + NOTES[key].replace(/[&<]/g, function(c){return c === '&' ? '&amp;' : '&lt;'}) + '</pre>';
    }
    doc.querySelectorAll('h2,h3').forEach(function(h){ if(!h.id) h.id = slug(h.textContent) });
    enhanceTables(); wrapAnswers(); enableChecklists(key); buildIndex();
    store.set('sss-tab', key);
    if (location.hash !== '#' + key) { try { history.replaceState(null, '', '#' + key) } catch(e) {} }
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){show(t.dataset.note)}) });

  // Text size
  var fs = parseInt(store.get('sss-fs') || '16', 10);
  function setFs(v){ fs = Math.max(13, Math.min(22, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); store.set('sss-fs', String(fs)) }
  setFs(fs);
  document.getElementById('smaller').addEventListener('click', function(){setFs(fs - 1)});
  document.getElementById('bigger').addEventListener('click', function(){setFs(fs + 1)});

  // Full screen, with a focus-mode fallback where the browser refuses it
  var root = document.documentElement, lbl = document.getElementById('fslbl');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) }
  function setFocus(on){ document.body.classList.toggle('focus', on) }
  function refresh(){ lbl.textContent = (isFs() || document.body.classList.contains('focus')) ? 'Exit full screen' : 'Full screen' }
  document.getElementById('fs').addEventListener('click', function(){
    if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return }
    var req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!req) { setFocus(true); refresh(); return }
    try {
      var p = req.call(root);
      if (p && p.catch) p.catch(function(){ setFocus(true); refresh() });
    } catch (e) { setFocus(true); refresh() }
  });
  document.getElementById('exitfocus').addEventListener('click', function(){ setFocus(false); refresh() });
  document.addEventListener('fullscreenchange', refresh);
  document.addEventListener('webkitfullscreenchange', refresh);

  window.addEventListener('hashchange', function(){
    var k = (location.hash || '').slice(1);
    if (NOTES[k] && store.get('sss-tab') !== k) show(k);
  });
  var start = (location.hash || '').slice(1);
  show(NOTES[start] ? start : (store.get('sss-tab') || 'law'));
})();
</script>
